<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub | Sign Up</title>
</head>
<body>
  <header>
    <h1>EventHub</h1>
  </header>

  <main>
    <h1>Create an Account</h1>

    <form id="signupForm" action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>

        <p>
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
        </p>

        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </p>

        <p>
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" required placeholder="10-digit mobile number">
        </p>
      </fieldset>

      <fieldset>
        <legend>Security</legend>

        <p>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required placeholder="Min 6 characters">
        </p>

        <p>
          <label for="confirmPassword">Confirm Password:</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter password">
        </p>
      </fieldset>

      <p>
        <button type="submit">Sign Up</button>
        <button type="reset">Clear</button>
      </p>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>
  </main>
</body>
</html>
