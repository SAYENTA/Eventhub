<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub | Register</title>
</head>
<body>
  <header>
    <h1>EventHub</h1>
    <p>
      <a href="index.html">Home</a> |
      <a href="events.html">Events</a> |
      <a href="event-details.html">Details</a> |
      <a href="register.html">Register</a> |
      <a href="my registration.html">My Tickets</a> |
      <a href="admin.html">Admin</a>
    </p>
  </header>

  <main>
    <h1>Event Registration</h1>
    <p>Fill in the form below to register for an event.</p>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>

        <p>
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required placeholder="Enter your full name">
        </p>

        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </p>

        <p>
          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" required placeholder="11-digit mobile number">
        </p>
      </fieldset>

      <fieldset>
        <legend>Event Selection</legend>

        <p>
          <label for="event">Choose Event:</label>
          <select id="event" name="event" required>
            <option value="">-- Select an event --</option>
            <option value="summer-beats">Summer Beats Festival (Jul 15)</option>
            <option value="tech-summit">Tech Innovators Summit (Aug 02)</option>
            <option value="art-expo">Art & amp; Craft Expo (Sep 10)</option>
            <option value="food-carnival">Food Carnival (Oct 05)</option>
            <option value="marathon">City Marathon 2025 (Nov 12)</option>
            <option value="film-screening">Indie Film Screening (Dec 01)</option>
          </select>
        </p>

        <p>
          <label for="ticketType">Ticket Type:</label>
          <select id="ticketType" name="ticketType" required>
            <option value="">-- Select ticket type --</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
            <option value="vip">VIP</option>
          </select>
        </p>

        <p>
          <label for="quantity">Number of Tickets:</label>
          <input type="number" id="quantity" name="quantity" min="1" max="10" value="1" required>
        </p>
      </fieldset>

      <fieldset>
        <legend>Additional Information</legend>

        <p>
          <label for="notes">Special Requests (optional):</label>
          <textarea id="notes" name="notes" rows="4" placeholder="Any dietary needs, accessibility requests, etc."></textarea>
        </p>

        <p>
          <label>
            <input type="checkbox" id="terms" name="terms" required>
            I agree to the terms & amp; conditions.
          </label>
        </p>
      </fieldset>

      <p>
        <button type="submit">Submit Registration</button>
        <button type="reset">Reset Form</button>
      </p>
    </form>
  </main>
</body>
</html>
