<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventHub | Event Details</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>EventHub</h1>
    <p>
      <a href="index.html">Home</a> |
      <a href="events.html">Events</a> |
      <a href="event-details.html">Details</a> |
      <a href="register.html">Register</a> |
      <a href="my registration.html">My Tickets</a> |
      <a href="admin.html">Admin</a>
    </p>
  </header>

  <main>
    <!-- Single-event view (used when ?id= is present) -->
    <div id="singleView" style="display:none;">
      <h1 id="eventTitle">Loading...</h1>
      <p id="eventTagline"></p>

      <section>
        <h2>Event Information</h2>
        <ul>
          <li><strong>Date:</strong> <span id="eventDate">—</span></li>
          <li><strong>Location:</strong> <span id="eventLocation">—</span></li>
        </ul>
      </section>

      <section>
        <h2>Actions</h2>
        <p>
          <a id="registerLink" href="register.html">Register Now</a> |
          <a href="event-details.html">See All Event Details</a> |
          <a href="events.html">Back to Events</a>
        </p>
      </section>
    </div>

    <!-- All-events view (used when no ?id=) -->
    <div id="listView">
      <h1>All Event Details</h1>
      <p>Pick an event to see full details.</p>
      <section id="detailsList">
        <!-- JS renders list here -->
      </section>
    </div>
  </main>

  <script src="js/events.js"></script>
  <script src="js/event-details.js"></script>
</body>
</html>
